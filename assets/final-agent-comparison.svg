<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="410" viewBox="0 0 1200 410" role="img" aria-labelledby="title desc">
  <title id="title">Final agent comparison</title>
  <desc id="desc">Yuki v16とNew Rocket v13.2の戦略、課題、最終変更を比較</desc>
  <rect width="1200" height="410" rx="24" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#0f172a">Two final agents, two different control problems</text>
  <g font-family="Segoe UI, sans-serif">
    <rect x="65" y="88" width="505" height="270" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <text x="105" y="130" font-size="25" font-weight="700" fill="#5b21b6">Yuki v16</text>
    <text x="105" y="160" font-size="16" fill="#6d28d9">Marnie's Grimmsnarl evolution control</text>
    <text x="105" y="205" font-size="17" font-weight="700" fill="#0f172a">Goal</text>
    <text x="105" y="232" font-size="15" fill="#334155">進化ライン・Bench枠・Energyを整え、</text>
    <text x="105" y="254" font-size="15" fill="#334155">Munkidoriと終盤Prize routeを両立</text>
    <text x="105" y="296" font-size="17" font-weight="700" fill="#0f172a">Final change</text>
    <text x="105" y="323" font-size="15" fill="#334155">限定条件のPoffin-before-Pad</text>
    <rect x="630" y="88" width="505" height="270" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="670" y="130" font-size="25" font-weight="700" fill="#1d4ed8">New_Rocket v13.2</text>
    <text x="670" y="160" font-size="16" fill="#2563eb">Spidops board width &amp; Mewtwo protection</text>
    <text x="670" y="205" font-size="17" font-weight="700" fill="#0f172a">Goal</text>
    <text x="670" y="232" font-size="15" fill="#334155">盤面を広げRocket Rushを強化しつつ、</text>
    <text x="670" y="254" font-size="15" fill="#334155">Mewtwo exと希少Energyを温存</text>
    <text x="670" y="296" font-size="17" font-weight="700" fill="#0f172a">Final change</text>
    <text x="670" y="323" font-size="15" fill="#334155">デッキ不変の対面限定D / P / R方針</text>
  </g>
</svg>
