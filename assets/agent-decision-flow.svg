<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Agent decision flow</title>
  <desc id="desc">Observationから特徴抽出、局面判定、合法手評価を経てActionを選択する流れ</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="260" rx="24" fill="url(#bg)"/>
  <text x="60" y="48" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Decision pipeline</text>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <g>
      <rect x="45" y="90" width="190" height="105" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
      <text x="140" y="135" font-size="20" font-weight="700" fill="#0f172a">Observation</text>
      <text x="140" y="164" font-size="15" fill="#475569">観測情報・合法手</text>
    </g>
    <g>
      <rect x="285" y="90" width="210" height="105" rx="16" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
      <text x="390" y="130" font-size="19" font-weight="700" fill="#0f172a">特徴抽出</text>
      <text x="390" y="159" font-size="14" fill="#475569">盤面・手札・Energy</text>
      <text x="390" y="181" font-size="14" fill="#475569">Prize・先攻後攻</text>
    </g>
    <g>
      <rect x="545" y="90" width="190" height="105" rx="16" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
      <text x="640" y="135" font-size="19" font-weight="700" fill="#0f172a">局面判定</text>
      <text x="640" y="164" font-size="14" fill="#475569">対面・攻撃・退避</text>
    </g>
    <g>
      <rect x="785" y="90" width="210" height="105" rx="16" fill="#ffffff" stroke="#818cf8" stroke-width="2"/>
      <text x="890" y="130" font-size="19" font-weight="700" fill="#0f172a">合法手を評価</text>
      <text x="890" y="159" font-size="14" fill="#475569">ルール・優先度</text>
      <text x="890" y="181" font-size="14" fill="#475569">対面固有の例外</text>
    </g>
    <g>
      <rect x="1045" y="90" width="110" height="105" rx="16" fill="#4f46e5"/>
      <text x="1100" y="135" font-size="20" font-weight="700" fill="#ffffff">Action</text>
      <text x="1100" y="164" font-size="14" fill="#e0e7ff">選択</text>
    </g>
  </g>
  <g stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <line x1="235" y1="142" x2="275" y2="142"/>
    <line x1="495" y1="142" x2="535" y2="142"/>
    <line x1="735" y1="142" x2="775" y2="142"/>
    <line x1="995" y1="142" x2="1035" y2="142"/>
  </g>
</svg>
